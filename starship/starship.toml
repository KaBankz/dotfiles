'$schema' = 'https://starship.rs/config-schema.json'

format = """\
$os$all$fill $time$line_break\
$sudo$character\
"""
# Example prompt
#  [2] ~ -------------------------------------------------------- 󱑍 12:00:00 AM
# $UDO ❯❯❯

add_newline = false

[os]
disabled = false

[os.symbols]
Macos = " "
Windows = " "
Linux = " "

[fill]
symbol = '󰜥'

[time]
disabled = false
format = '[ 󱑍 $time]($style)'
use_12hr = true

[shlvl]
disabled = false
format = '[\[$shlvl\] ]($style)'
style = 'bold fg:purple'
threshold = 2

[sudo]
format = '[$symbol ]($style)'
style = 'bold fg:yellow'
symbol = '\$UDO'
disabled = false

[git_branch]
symbol = " "

[character]
format = '$symbol '
success_symbol = '[❯❯❯](bold fg:green)'
error_symbol = '[❯❯❯](bold fg:red)'
vimcmd_symbol = '[❮❮❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮❮❮](bold fg:purple)'
vimcmd_replace_symbol = '[❮❮❮](bold fg:purple)'
vimcmd_visual_symbol = '[❮❮❮](bold fg:yellow)'
