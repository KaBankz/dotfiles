# add ctrl-a as secondary prefix key
set-option -g prefix2 C-a
bind-key C-a send-prefix -2

# enable mouse
set-option -g mouse on

# needed by Control + Shift bindings
set-option -g extended-keys on

# start windows numbering at 1
set-option -g base-index 1
# make pane numbering consistent with windows
set-option -gw pane-base-index 1

# rename window to reflect current program
set-option -gw automatic-rename on
# renumber windows when a window is closed
set-option -g renumber-windows on

# switch to another existing session when killing current session
set-option -g detach-on-destroy off
# set terminal title
set-option -g set-titles on

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set-option -s escape-time 0

# Increase scrollback buffer size from 2000 to 50000 lines
set-option -g history-limit 50000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set-option -g status-interval 5

# Emacs key bindings in tmux command prompt (prefix + :) are better
# than vi keys, even for vim users
set-option -g status-keys emacs

# Enable vi keys in copy mode
set-option -gw mode-keys vi

# Focus events enabled for terminals that support them
set-option -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
set-option -gw aggressive-resize on

set-option -gw monitor-activity on
set-option -g visual-activity off

### Keybindings

# switch panes using Meta-hjkl without prefix
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# switch windows using Meta-Ctrl-hl without prefix
bind-key -n M-C-h previous-window
bind-key -n M-C-l next-window

# use vim keybindings in copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key P paste-buffer

# smooth mouse scrolling (1 line at a time)
bind-key -T copy-mode-vi WheelUpPane send-keys -N1 -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -N1 -X scroll-down

# open lazygit in a popup
bind-key g display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"

bind-key c new-window -c "#{pane_current_path}"

# interactive window selection with panes
bind-key o choose-tree

# split current window horizontally
bind-key j split-window -v -c "#{pane_current_path}"

# split current window vertically
bind-key k split-window -h -c "#{pane_current_path}"

# toggle zoom
bind-key z resize-pane -Z

# create/kill sessions
bind-key S command-prompt -p "New Session:" "new-session -A -s '%%'"
bind-key K confirm kill-session

# edit tmux config
bind-key e new-window -n "tmux.conf" "sh -c '\${EDITOR:-vim} \$XDG_CONFIG_HOME/tmux/tmux.conf && tmux source \$XDG_CONFIG_HOME/tmux/tmux.conf && tmux display \"Config Reloaded\"'"

# reload tmux config
bind-key R source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display-message "Config Reloaded"
bind-key r refresh-client \; display-message "Refreshed Client"

# TPM plugins
set-option -g @plugin "tmux-plugins/tpm"
set-option -g @plugin "tmux-plugins/tmux-resurrect"
set-option -g @plugin "tmux-plugins/tmux-continuum"
set-option -g @continuum-restore "on"

# Install tpm if it doesn't exist
if "test ! -d $XDG_CONFIG_HOME/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm $XDG_CONFIG_HOME/tmux/plugins/tpm && $XDG_CONFIG_HOME/tmux/plugins/tpm/bin/install_plugins'"

# Initialize tpm
run-shell "$XDG_CONFIG_HOME/tmux/plugins/tpm/tpm"

# Tokyo Night theme

set-option -g mode-style "fg=#7aa2f7,bg=#3b4261"

set-option -g message-style "fg=#7aa2f7,bg=#3b4261"
set-option -g message-command-style "fg=#7aa2f7,bg=#3b4261"

set-option -g pane-border-style "fg=#3b4261"
set-option -g pane-active-border-style "fg=#7aa2f7"

set-option -g status "on"
set-option -g status-justify "left"

set-option -g status-style "fg=#7aa2f7,bg=#16161e"

set-option -g status-left-length "100"
set-option -g status-right-length "100"

set-option -g status-left-style NONE
set-option -g status-right-style NONE

set-option -g status-left "#[fg=#15161e,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#16161e,nobold,nounderscore,noitalics]"
set-option -g status-right "#[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#16161e] #{?client_prefix,⌨,} #[fg=#3b4261,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261] %Y-%m-%d  %I:%M %p #[fg=#7aa2f7,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#15161e,bg=#7aa2f7,bold] #h "
if-shell '[ "$(tmux show-option -gqv "clock-mode-style")" == "24" ]' {
  set-option -g status-right "#[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#16161e] #{?client_prefix,⌨,} #[fg=#3b4261,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261] %Y-%m-%d  %H:%M #[fg=#7aa2f7,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#15161e,bg=#7aa2f7,bold] #h "
}

set-option -gw window-status-activity-style "underscore,fg=#a9b1d6,bg=#16161e"
set-option -gw window-status-separator ""
set-option -gw window-status-style "NONE,fg=#a9b1d6,bg=#16161e"
set-option -gw window-status-format "#[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]"
set-option -gw window-status-current-format "#[fg=#16161e,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261,bold] #I  #W #F #[fg=#3b4261,bg=#16161e,nobold,nounderscore,noitalics]"
