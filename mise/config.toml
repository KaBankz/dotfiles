[tools]
node = "lts"
bun = "latest"
deno = "latest"
python = "latest"
uv = "latest"
java = "zulu-21"
zig = "latest"
go = "latest"
rust = "stable"
"cargo:krabby" = "latest"
"npm:eas-cli" = "latest"
"npm:typescript-language-server" = "latest"
"github:itzg/rcon-cli" = "latest"
